<script src="../../importmap.js"></script>

<style>
	body,
	html {
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 0;
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
		display: flex;
		justify-content: center;
		align-items: center;
	}

	/* Optional 3D scene background */
	#background-scene {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: -1;
		opacity: 0.3;
	}

	.demo-container {
		max-width: 800px;
		width: 90%;
		margin: 20px;
	}

	.demo-header {
		text-align: center;
		color: white;
		margin-bottom: 30px;
	}

	.demo-header h1 {
		font-size: 2.5rem;
		margin: 0 0 10px 0;
		font-weight: 700;
	}

	.demo-header p {
		font-size: 1.2rem;
		opacity: 0.9;
		margin: 0;
	}

	/* Chat widget will style itself */
</style>

<!-- Optional 3D background scene -->
<lume-scene id="background-scene" webgl enable-css="false">
	<lume-ambient-light intensity="0.3"></lume-ambient-light>
	
	<!-- Animated floating spheres for visual interest -->
	<lume-sphere
		id="sphere1"
		size="20 20 20"
		position="-100 -50 -200"
		color="#ffffff"
		has="basic-material"
		opacity="0.6"
	></lume-sphere>
	
	<lume-sphere
		id="sphere2" 
		size="15 15 15"
		position="80 60 -150"
		color="#ffffff"
		has="basic-material"
		opacity="0.4"
	></lume-sphere>
	
	<lume-sphere
		id="sphere3"
		size="12 12 12"
		position="-80 80 -100"
		color="#ffffff"
		has="basic-material"
		opacity="0.5"
	></lume-sphere>
</lume-scene>

<div class="demo-container">
	<div class="demo-header">
		<h1>💬 Chat Widget Demo</h1>
		<p>Built with @lume/element and powered by Meteor</p>
	</div>
	
	<!-- The custom chat widget element -->
	<chat-widget></chat-widget>
</div>

<script type="module" src="./chat-widget.js"></script>
<script type="module" src="./background-animation.js"></script>
<script type="module">
	// Initialize the background animation
	import { initBackgroundAnimation } from './background-animation.js'
	initBackgroundAnimation()
</script>
